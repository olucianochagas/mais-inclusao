  - name: ⚖️ Reportar violação do Código de Conduta
    url: https://github.com/olucianochagas/mais-inclusao/blob/main/CODE-OF-CONDUCT.md#como-reportar
    about: Reporte violações de forma confidencial via canal descrito no Código de Conduta.

  - name: 📖 Ler documentação primeiro
    url: https://github.com/olucianochagas/mais-inclusao#readme
    about: README, CONTRIBUTING, GOVERNANCE, SUPPORT, SECURITY — provavelmente sua dúvida já está documentada.
