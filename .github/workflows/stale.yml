# ────────────────────────────────────────────────────────────────
# Stale — gestão de inatividade em issues e PRs
# Marca como stale após X dias sem atividade; fecha após Y dias adicionais.
# Issues a11y, security, bug-críticos NUNCA são marcadas como stale.
# ────────────────────────────────────────────────────────────────
name: Stale

on:
  schedule:
    # Diariamente às 08:00 UTC (= 05:00 America/Sao_Paulo).
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: 🕸  Mark inactive issues and PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operations-per-run: 100
          remove-stale-when-updated: true
          ascending: true

          # ─── Issues ────────────────────────────────────────────
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: 'stale'
          stale-issue-message: |
            👋 Esta issue ficou sem atividade por 60 dias e foi marcada como **stale**.

            - Se ainda é relevante, comente para reativar.
            - Se for **bug em produção**, **acessibilidade**, **segurança** ou **LGPD**, peça reabertura imediata — esses tipos têm SLA próprio.
            - Sem atividade nos próximos 14 dias, será fechada (mas pode ser reaberta).
          close-issue-message: |
            Encerrada por inatividade. Reabra se ainda for relevante — sem julgamento.
          exempt-issue-labels: 'a11y,security,lgpd,bug-critical,wave-1,wave-2,wave-3,pinned,help wanted,governance,rfc'

          # ─── Pull Requests ─────────────────────────────────────
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: 'stale'
          stale-pr-message: |
            👋 Este PR ficou sem atividade por 30 dias e foi marcado como **stale**.

            - Se ainda está em curso, faça push ou comente para reativar.
            - Se foi bloqueado aguardando review, ping educado a um mantenedor é bem-vindo.
            - Sem atividade nos próximos 14 dias, será fechado (mas pode ser reaberto).
          close-pr-message: |
            Encerrado por inatividade. Reabra se ainda for relevante.
          exempt-pr-labels: 'pinned,wip,blocked,security,lgpd,wave-1,changeset'
          exempt-draft-pr: true
