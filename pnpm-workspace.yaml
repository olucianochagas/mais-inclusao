# ─────────────────────────────────────────────────────────────
# pnpm workspaces — declaração de pacotes do monorepo
# ─────────────────────────────────────────────────────────────
packages:
  - apps/*
  - packages/*
  - tools/*

# ─────────────────────────────────────────────────────────────
# Catalog — versionamento centralizado de deps compartilhadas
# entre workspaces. Cada workspace referencia com "catalog:"
# em vez de versão literal, evitando drift entre apps/packages.
# Docs: https://pnpm.io/catalogs
# ─────────────────────────────────────────────────────────────
catalog:
  # Runtime
  typescript: ^5.6.3

  # Backend stack (Onda 1)
  "@nestjs/common": ^11.0.0
  "@nestjs/core": ^11.0.0
  "@nestjs/microservices": ^11.0.0
  "@nestjs/platform-express": ^11.0.0
  "@nestjs/config": ^4.0.0
  "@nestjs/jwt": ^11.0.0
  "@nestjs/passport": ^11.0.0
  "@prisma/client": ^6.0.0
  prisma: ^6.0.0
  zod: ^3.23.8
  pino: ^9.5.0
  "nestjs-pino": ^4.2.0
  argon2: ^0.41.1
  nats: ^2.28.0
  ioredis: ^5.4.1
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2

  # OpenTelemetry
  "@opentelemetry/api": ^1.9.0
  "@opentelemetry/sdk-node": ^0.55.0
  "@opentelemetry/auto-instrumentations-node": ^0.53.0
  "@opentelemetry/exporter-trace-otlp-grpc": ^0.55.0

  # Frontend stack (Onda 1)
  react: ^19.0.0
  "react-dom": ^19.0.0
  "react-router-dom": ^7.0.0
  "@tanstack/react-query": ^5.59.0
  zustand: ^5.0.0
  "react-hook-form": ^7.53.0
  "@hookform/resolvers": ^3.9.0
  "react-i18next": ^15.1.0
  i18next: ^23.16.0
  "lucide-react": ^0.460.0
  "class-variance-authority": ^0.7.0
  clsx: ^2.1.0
  "tailwind-merge": ^2.5.0

  # Tailwind 4
  tailwindcss: ^4.0.0
  "@tailwindcss/forms": ^0.5.9
  postcss: ^8.4.49
  autoprefixer: ^10.4.20

  # Rspack + Module Federation 2.0
  "@rspack/core": ^1.1.0
  "@rspack/cli": ^1.1.0
  "@module-federation/enhanced": ^0.7.0
  "@module-federation/runtime": ^0.7.0

  # Build tools
  tsup: ^8.3.5
  "zod-to-json-schema": ^3.24.1

  # Testing
  vitest: ^2.1.5
  "@vitest/coverage-v8": ^2.1.5
  "@testing-library/react": ^16.1.0
  "@testing-library/jest-dom": ^6.6.3
  "@testing-library/user-event": ^14.5.2
  "@testing-library/jest-axe": ^9.0.0
  "@playwright/test": ^1.49.0
  "@axe-core/playwright": ^4.10.0
  testcontainers: ^10.13.2
  "@pact-foundation/pact": ^13.1.0

  # Tooling cross-workspace
  eslint: ^9.16.0
  "typescript-eslint": ^8.16.0
  "@typescript-eslint/parser": ^8.16.0
  "@typescript-eslint/eslint-plugin": ^8.16.0
  "eslint-plugin-react": ^7.37.2
  "eslint-plugin-react-hooks": ^5.1.0
  "eslint-plugin-jsx-a11y": ^6.10.2
  "eslint-plugin-security": ^3.0.1
  "eslint-plugin-import": ^2.31.0
  "eslint-plugin-simple-import-sort": ^12.1.1

# ─────────────────────────────────────────────────────────────
# Build dependencies allow-list — defesa contra supply chain
# attack. pnpm 9+ bloqueia scripts postinstall de pacotes não-
# listados aqui. Cada adição deve ser revisada (PR explícito).
# Docs: https://pnpm.io/settings#onlybuiltdependencies
# ─────────────────────────────────────────────────────────────
onlyBuiltDependencies:
  # Geram código nativo / clients
  - "@prisma/client"
  - prisma
  - argon2
  - "@swc/core"
  - esbuild
  # Rspack tem binários nativos por plataforma
  - "@rspack/binding-linux-x64-gnu"
  - "@rspack/binding-darwin-x64"
  - "@rspack/binding-darwin-arm64"
  - "@rspack/binding-win32-x64-msvc"
  - "unrs-resolver"
  # Playwright baixa browsers
  - "@playwright/browser-chromium"
  - "@playwright/browser-firefox"
  - "@playwright/browser-webkit"
  - playwright
  - "playwright-core"
  # Husky instala hooks
  - husky
  # Sharp para imagens (se vier)
  - sharp

# ─────────────────────────────────────────────────────────────
# Performance / segurança
# ─────────────────────────────────────────────────────────────
strictPeerDependencies: false
dedupePeerDependents: true
autoInstallPeers: true
shamefullyHoist: false
shellEmulator: false
saveExact: false
allowBuilds:
  esbuild: true
